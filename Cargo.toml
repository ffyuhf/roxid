# roxid：Ollama 全功能复刻（Rust 实现，llama.cpp llama-server 子进程后端）
# 架构决策来源：用户确认 2026-08-24 18:22（Q1 子进程模式）
[workspace]
resolver = "2"
members = ["crates/roxid-server", "crates/roxid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# 依赖统一在工作区声明，子 crate 以 xxx.workspace = true 引用，保证版本一致
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
sha2 = "0.10"
rustyline = "13"
indicatif = "0.17"
# M109（迭代33 碴2）：CLI 终端列数探测（COLUMNS env 优先 → tty ioctl →
# 兜底 80）——原进度帧/list 列宽恒按固定宽渲染，窄终端不收敛。注：
# indicatif 0.17 无 terminal_size feature（实证 available features 无此项），
# 宽度截断在 CLI 渲染层完成，不经 indicatif
terminal_size = "0.3"
# M17 引入（用户裁决 R2-2A 2026-08-24 19:59）：signin 令牌隐蔽输入
rpassword = "7"
# M24 引入（迭代4 裁决 Q2 2026-08-26 05:24）：config.toml 结构化读写（纯 Rust，不影响 musl 静态单二进制）
toml = "0.8"
# M21 引入（迭代3计划 D4d）：网关 CORS 中间件（axum 0.7 配套版本）
tower-http = { version = "0.5", features = ["cors"] }
# M46 引入（迭代18 BUG-10）：runner 孤儿防护 prctl(PR_SET_PDEATHSIG)
libc = "0.2"
# M146 引入（迭代41 用户终裁 2026-09-11 09:26）：create -i 全屏 TUI 交互向导
# （版本经 USTC 镜像索引核实 2026-09-11：ratatui 最新稳定 0.30.2，其官方
# 声明配套 crossterm ^0.29；纯 Rust 无 C 绑定，musl 静态兼容）
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
lto = true
